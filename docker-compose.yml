services:

  # ============================================================
  # MongoDB
  # ============================================================
  mongodb:
    image: mongo:8
    container_name: gckavacha-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: gckavacha

    volumes:
      - mongodb-data:/data/db

    networks:
      - gckavacha-network


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:8
    container_name: gckavacha-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis-data:/data

    networks:
      - gckavacha-network


  # ============================================================
  # Apache Kafka - KRaft Mode
  # ============================================================
  kafka:
    image: apache/kafka:4.1.0
    container_name: gckavacha-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      # --------------------------------------------------------
      # KRaft
      # --------------------------------------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # --------------------------------------------------------
      # Listeners
      # --------------------------------------------------------
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # --------------------------------------------------------
      # Single-node development configuration
      # --------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      # --------------------------------------------------------
      # Retention
      # --------------------------------------------------------
      KAFKA_LOG_RETENTION_HOURS: 168

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - gckavacha-network


# ============================================================
# Persistent Volumes
# ============================================================
volumes:

  mongodb-data:
    name: gckavacha-mongodb-data

  redis-data:
    name: gckavacha-redis-data

  kafka-data:
    name: gckavacha-kafka-data


# ============================================================
# Shared Network
# ============================================================
networks:

  gckavacha-network:
    name: gckavacha-network
    driver: bridge